<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Mengalihkan ke Si-ManDa...</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#334155;text-align:center;padding:24px}
  .k{max-width:420px}
  h1{font-size:18px;margin:0 0 8px;color:#1e293b}
  p{font-size:13px;line-height:1.6;margin:6px 0}
  a{color:#4338ca;font-weight:700}
</style>
</head>
<body>
<div class="k">
  <h1>Alamat Si-ManDa telah berpindah</h1>
  <p>Anda sedang dialihkan ke alamat baru <b>simanda.disdik-ternate.com</b>.</p>
  <p>Jika tidak berpindah otomatis, <a id="tautan" href="https://simanda.disdik-ternate.com/">klik di sini</a>.</p>
</div>
<script>
  // Alamat lama (disdik-ternate.com) -> alamat baru, dengan jalur, query, dan hash yang sama
  // (mis. QR lama /public/statusverif/XYZ otomatis menjadi simanda.disdik-ternate.com/public/statusverif/XYZ).
  (function () {
    var tujuan = 'https://simanda.disdik-ternate.com' + location.pathname + location.search + location.hash;
    var a = document.getElementById('tautan');
    if (a) a.href = tujuan;
    location.replace(tujuan);
  })();
</script>
</body>
</html>
